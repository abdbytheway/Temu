<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #000000;
        }

        .container {
            max-width: 400px;
            width: 100%;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #000000;
            margin-bottom: 4px;
        }

        .subtitle {
            color: #666666;
            font-size: 14px;
            margin-bottom: 40px;
        }

        .input-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #000000;
            margin-bottom: 6px;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            font-size: 15px;
            border: 1px solid #000000;
            border-radius: 0;
            outline: none;
            background: #ffffff;
        }

        input[type="number"]:focus {
            border-color: #000000;
        }

        .result-box {
            border: 1px solid #000000;
            padding: 24px;
            margin: 32px 0;
        }

        .result-label {
            font-size: 13px;
            color: #666666;
            margin-bottom: 8px;
        }

        .result-value {
            font-size: 32px;
            font-weight: 600;
            color: #000000;
            margin-bottom: 20px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid #000000;
            border-radius: 0;
            cursor: pointer;
            background: #000000;
            color: #ffffff;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #ffffff;
            color: #000000;
        }

        .btn:active {
            opacity: 0.8;
        }

        .info-text {
            font-size: 12px;
            color: #666666;
            text-align: center;
            margin-top: 16px;
        }

        .calculation-details {
            border-top: 1px solid #000000;
            padding-top: 16px;
            margin-top: 16px;
            font-size: 13px;
            color: #000000;
        }

        .calculation-details div {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .calculation-details div:last-child {
            margin-bottom: 0;
            padding-top: 6px;
            border-top: 1px solid #000000;
            font-weight: 600;
            margin-top: 6px;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #000000;
            color: #ffffff;
            padding: 12px 20px;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Price Calculator</h1>
        <p class="subtitle">Amazon to Temu pricing</p>

        <div class="input-group">
            <label for="amazonPrice">Amazon Price ($)</label>
            <input type="number" id="amazonPrice" placeholder="0.00" step="0.01" min="0">
        </div>

        <div class="input-group">
            <label for="discountPercent">Discount Percentage (%)</label>
            <input type="number" id="discountPercent" value="10" step="0.1" min="0" max="100">
        </div>

        <div class="result-box">
            <div class="result-label">Temu Price</div>
            <div class="result-value" id="temuPrice">$0.00</div>
            <button class="btn" onclick="copyPrice()">Copy Price</button>
            
            <div class="calculation-details" id="calculationDetails" style="display: none;">
                <div>
                    <span>Amazon Price:</span>
                    <span id="calcAmazon">$0.00</span>
                </div>
                <div>
                    <span id="calcDiscountLabel">Discount (10%):</span>
                    <span id="calcDiscount">-$0.00</span>
                </div>
                <div>
                    <span>Final Price:</span>
                    <span id="calcFinal">$0.00</span>
                </div>
            </div>
        </div>

        <p class="info-text">Enter Amazon price to calculate Temu pricing</p>
    </div>

    <div class="toast" id="toast">Price copied to clipboard!</div>

    <script>
        const amazonPriceInput = document.getElementById('amazonPrice');
        const discountPercentInput = document.getElementById('discountPercent');
        const temuPriceDisplay = document.getElementById('temuPrice');
        const calculationDetails = document.getElementById('calculationDetails');

        function calculatePrice() {
            const amazonPrice = parseFloat(amazonPriceInput.value) || 0;
            const discountPercent = parseFloat(discountPercentInput.value) || 0;

            if (amazonPrice > 0) {
                const discountAmount = amazonPrice * (discountPercent / 100);
                const finalPrice = Math.max(0, amazonPrice - discountAmount);

                temuPriceDisplay.textContent = '$' + finalPrice.toFixed(2);

                // Update calculation details
                document.getElementById('calcAmazon').textContent = '$' + amazonPrice.toFixed(2);
                document.getElementById('calcDiscountLabel').textContent = `Discount (${discountPercent}%):`;
                document.getElementById('calcDiscount').textContent = '-$' + discountAmount.toFixed(2);
                document.getElementById('calcFinal').textContent = '$' + finalPrice.toFixed(2);
                
                calculationDetails.style.display = 'block';
            } else {
                temuPriceDisplay.textContent = '$0.00';
                calculationDetails.style.display = 'none';
            }
        }

        function copyPrice() {
            const priceText = temuPriceDisplay.textContent;
            navigator.clipboard.writeText(priceText).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            });
        }

        amazonPriceInput.addEventListener('input', calculatePrice);
        discountPercentInput.addEventListener('input', calculatePrice);

        // Initial calculation
        calculatePrice();
    </script>
</body>
</html>
